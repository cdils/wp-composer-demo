# Reusable build-and-deploy pipeline.
#
# Staging and production both call THIS file. They differ only in inputs and
# the secrets bound to them — there is no second copy of the build steps to
# drift out of sync. Copy-pasting between environment workflows is how a
# production file ends up saying `environment: staging` and silently
# bypassing every required-reviewer rule, so we don't copy-paste.

name: Build & Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment to deploy into (staging | production)'
        required: true
        type: string
      url:
        description: 'Public URL, for the deployment summary'
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PATH:
        required: true
      SSH_PORT:
        required: false
      SSH_PRIVATE_KEY:
        required: true

# One deploy at a time per environment. Two rsyncs racing into the same
# docroot is a corrupted release.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: cli, curl, mbstring, xml, zip, intl
          tools: composer:v2
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Installs WordPress core into cms/ and composer-managed plugins/themes
      # into wp-content/, per the installer-paths in composer.json.
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build theme assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble release (flat WordPress layout)
        run: |
          set -euo pipefail

          # Local dev uses a SUBDIRECTORY layout: core in cms/, wp-content at
          # the repo root, a front-controller index.php, and a dev wp-config
          # that reads .env. The SERVER runs a STANDARD FLAT layout: core and
          # wp-content together in the docroot with the server's OWN
          # wp-config.php. Reassemble: move wp-content INTO cms/, ship the
          # CONTENTS of cms/ as the docroot. The dev index.php and dev
          # wp-config.php are NOT shipped.

          # 1. Strip build inputs and anything that must never reach a docroot.
          find wp-content -type d -name node_modules -prune -exec rm -rf {} + || true
          find wp-content cms -type d \
            \( -name .git -o -name .github -o -name tests -o -name __tests__ \) \
            -prune -exec rm -rf {} + || true
          find wp-content cms \( -name '.env' -o -name '.env.*' -o -name 'id_rsa*' -o -name '*.pem' \) -exec rm -f {} + || true
          rm -f auth.json .env
          rm -rf wp-content/themes/demo-child/src   # ship built assets only

          # 2. Reassemble into a standard WordPress tree inside cms/.
          #    `rm -rf cms/wp-content` drops core's bundled default themes;
          #    the `mv` puts our real wp-content in their place.
          rm -rf cms/wp-content
          mv wp-content cms/wp-content

          echo "docroot payload: $(du -sh cms | cut -f1)"

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: cms-build-${{ inputs.environment }}
          path: cms/
          retention-days: 3

  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    # Bound to the caller's input, so it can never disagree with the secrets
    # it uses.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: cms-build-${{ inputs.environment }}
          path: cms/

      # rsync ships cms/ (a complete standard WordPress docroot) into the
      # server docroot. Everything excluded is server-owned or runtime state.
      #
      # ANCHORING MATTERS: an unanchored rsync exclude matches its basename at
      # ANY depth — a bare `logging/` would also strip a plugin's internal
      # logging/ directory and break the site. Host-root files are therefore
      # anchored with a leading `/`. The unanchored ones (wp-config.php, .env,
      # auth.json) are intentional: those must never ship from ANY depth.
      # Demo-friendly guard: this repo ships with no real server, so the SSH
      # secrets are unset. Secrets are not readable inside `if:` expressions,
      # so a tiny step maps one to env and exposes presence as an output.
      # In a real project, delete this guard and let a missing secret fail loudly.
      - name: Check deploy credentials
        id: creds
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deploy credentials configured — demo mode, skipping rsync."
          fi

      - name: Deploy via rsync
        if: steps.creds.outputs.present == 'true'
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -azr --delete --no-perms --links
            --exclude='wp-config.php'
            --exclude='.env'
            --exclude='auth.json'
            --exclude='/.htaccess'
            --exclude='/.user.ini'
            --exclude='wp-content/uploads/'
            --exclude='wp-content/cache/'
            --exclude='wp-content/upgrade/'
            --exclude='wp-content/object-cache.php'
            --exclude='wp-content/advanced-cache.php'
            --exclude='wp-content/db.php'
            --exclude='wp-content/debug.log*'
          path: cms/
          remote_path: ${{ secrets.SSH_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT || 22 }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ inputs.environment }}"
            echo ""
            echo "- **URL:** ${{ inputs.url }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Ref:** \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
