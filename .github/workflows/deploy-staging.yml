# Staging: everything merged to `develop` lands here automatically.
#
# All the work happens in deploy.yml. This file exists only to say WHICH
# environment and WHICH secrets — so there is nothing here to fall out of
# step with production.

name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      url: https://staging.example.com
    secrets:
      SSH_HOST: ${{ secrets.SSH_STAGING_HOST }}
      SSH_USER: ${{ secrets.SSH_STAGING_USER }}
      SSH_PATH: ${{ secrets.SSH_STAGING_PATH }}
      SSH_PORT: ${{ secrets.SSH_STAGING_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_STAGING_PRIVATE_KEY }}
